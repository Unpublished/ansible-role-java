---
name: CI
'on':
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install test dependencies.
        run: pip install -r requirements.txt "ansible-compat<2.0"

      - name: Run yamllint tests.
        run: yamllint . -c .yamllint

      - name: Run ansible-lint tests.
        run: ansible-lint . -c .ansible-lint

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        playbook: [playbook.yml]
        python:
          - "3.10"
        include:
          - playbook: adoptopenjdk-repositories.yml
            python: "3.10"
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies.
        run: pip install -r requirements.txt "ansible-compat<2.0"

      - name: Run Molecule tests.
        run: molecule test -s default
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_LIBRARY: ~/.ansible/plugins/modules
          MOLECULE_PLAYBOOK: ${{ matrix.playbook }}
