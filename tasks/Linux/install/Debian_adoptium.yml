---
- name: Install GPG prerequisites for Adoptium
  apt:
    name:
      - apt-transport-https
      - gnupg
    state: present
    update_cache: true

- name: Ensure /usr/share/keyrings directory exists
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download Adoptium GPG key
  get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /tmp/adoptium.gpg.asc
    mode: '0644'
  register: adoptium_key_download
  retries: 3
  delay: 5
  until: adoptium_key_download is succeeded

- name: Import Adoptium GPG key into keyring
  command: gpg --batch --yes --dearmor -o /usr/share/keyrings/adoptium.gpg /tmp/adoptium.gpg.asc
  args:
    creates: /usr/share/keyrings/adoptium.gpg

- name: Remove temporary Adoptium GPG key file
  file:
    path: /tmp/adoptium.gpg.asc
    state: absent

- name: Add repository for Adoptium
  apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/adoptium.gpg]
      https://packages.adoptium.net/artifactory/deb/
      {{ ansible_distribution_release }} main
    filename: adoptium
    state: present
    update_cache: true

- name: Install java packages
  apt:
    deb: '{{ java_artifact | default(omit, true) }}'
    name: '{{ (jdk_package if transport == "repositories") | default(omit, true) }}'
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: package_install
  until: package_install is succeeded
